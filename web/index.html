<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WhenSAR</title>
  <meta name="description" content="When will NISAR next image this spot?">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232563eb'/%3E%3Cpath d='M9 20 L16 8 L23 20' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/flatgeobuf-geojson.min.js"></script>
  <script src="vendor/tz.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="map"></div>
  <div id="polar-arctic" class="polar" hidden></div>
  <div id="polar-antarctic" class="polar" hidden></div>
  <select id="proj" class="proj" aria-label="Map projection" title="Map projection">
    <option value="geo">Geographic</option>
    <option value="arctic">Arctic</option>
    <option value="antarctic">Antarctic</option>
  </select>
  <header class="topbar">
    <span class="brand">WhenSAR</span>
    <div class="mission-switch" role="group" aria-label="Mission">
      <button data-m="nisar" aria-pressed="true">NISAR</button><button data-m="s1" aria-pressed="false">Sentinel-1</button>
    </div>
    <button id="locate" title="Use my location" aria-label="Use my location">◎</button>
    <button id="sites-btn" title="Saved sites" aria-label="Saved sites" aria-expanded="false">★</button>
  </header>
  <div id="sites" class="sites" hidden></div>
  <aside id="panel" class="panel" hidden>
    <div class="grabber" id="grabber" role="button" aria-label="Collapse or expand" tabindex="0"></div>
    <div class="panel-head" id="panel-head">
      <div id="where"></div>
      <div class="head-right">
        <span id="date-pick" class="date-pick" title="Plan for a date: see the passes in any 12-day cycle ahead">
          <span id="date-btn" class="icon-btn" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
          <input type="date" id="date-input" aria-label="Plan for a date">
        </span>
        <button id="save" class="icon-btn" aria-label="Save this site" title="Save this site (works offline)">☆</button>
        <div id="pager" class="pager"></div>
        <button id="close" class="close" aria-label="Close">✕</button>
      </div>
    </div>
    <div id="cards" class="cards"></div>
  </aside>
  <div id="hint" class="hint">Tap the map to see when NISAR images that spot</div>
</body>
</html>
