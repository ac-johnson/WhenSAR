<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WhenSAR</title>
  <meta name="description" content="When will NISAR next image this spot?">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232563eb'/%3E%3Cpath d='M9 20 L16 8 L23 20' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/flatgeobuf@3.36.0/dist/flatgeobuf-geojson.min.js"></script>
  <script src="https://unpkg.com/tz-lookup@6.1.25/tz.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="map"></div>
  <header class="topbar">
    <span class="brand">WhenSAR</span>
    <span class="mission">NISAR</span>
    <button id="locate" title="Use my location" aria-label="Use my location">◎</button>
  </header>
  <aside id="panel" class="panel" hidden>
    <div class="panel-head">
      <div id="where"></div>
      <div id="pager" class="pager"></div>
    </div>
    <div id="cards" class="cards"></div>
  </aside>
  <div id="hint" class="hint">Tap the map to see when NISAR images that spot</div>
</body>
</html>
