name: Build data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"  # nightly, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Restore frame-time cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: frame-times-${{ github.run_id }}
          restore-keys: frame-times-

      - name: Test
        run: python -m pytest -q tests

      - name: Build data
        run: |
          python pipeline/frame_times.py
          python pipeline/snapshot_rop.py
          python pipeline/latency_stats.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
