name: Build data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Restore granule index cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          # NISAR granule index + Sentinel-1 scene index. A cache miss triggers one-time
          # backfills (~20 + ~25 min); later runs are incremental
          key: granule-index-v1-${{ github.run_id }}
          restore-keys: granule-index-v1-

      - name: Test
        run: python -m pytest -q tests

      # One step per source, so the run summary shows which one is slow or failing
      - name: NISAR granule index (CMR)
        run: python pipeline/granule_index.py
      - name: NISAR plan snapshot (ASF ArcGIS)
        run: python pipeline/snapshot_rop.py
      - name: Sentinel-1 plan (ESA)
        run: python pipeline/s1_plan.py
      - name: Sentinel-1 scenes (ASF)
        run: python pipeline/s1_index.py
      - name: Latency stats (ASF, CMR)
        run: python pipeline/latency_stats.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
